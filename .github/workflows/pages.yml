name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Write access only where the deploy needs it (the deploy job below).
permissions:
  contents: read

# Per event and branch: a pull request's checks never cancel a deploy of main.
concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with the wasm32 target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown --component clippy
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: cargo-${{ hashFiles('engine/Cargo.toml', 'engine/Cargo.lock', 'engine/src/**') }}

      # A syntax error in any module leaves the whole page blank: check them all first.
      - name: Check the JavaScript and run its tests
        run: |
          for f in web/js/*.js; do node --check "$f"; done
          node --test tests/*.test.mjs

      # engine/.cargo/config.toml builds for wasm32 by default; tests run on the host.
      - name: Test the engine bindings
        working-directory: engine
        run: cargo test --target x86_64-unknown-linux-gnu

      - name: Clippy (the wasm build, and the tests on the host)
        working-directory: engine
        run: |
          cargo clippy --release -- -D warnings
          cargo clippy --tests --target x86_64-unknown-linux-gnu -- -D warnings

      - name: Build TavernGym for WebAssembly
        working-directory: engine
        run: cargo build --release

      - name: Assemble site
        run: |
          mkdir -p web/engine
          cp engine/target/wasm32-unknown-unknown/release/taverngym_wasm.wasm web/engine/taverngym.wasm
          rm -rf web/testdata
          ls -la web web/engine

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: web

  # Pull requests only run the checks above; main (push or a manual run) is deployed.
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
