[package]
name = "taverngym-wasm"
description = "WebAssembly bindings of TavernGym for the bg_advisor web app"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# TavernGym (Battlegrounds 37.0.2).
taverngym = { git = "https://github.com/MCG-NJU/AutoTavern", rev = "1c2086a997afde46d68c6c5992cab194ddcfce88" }
serde_json = "1.0.151"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
