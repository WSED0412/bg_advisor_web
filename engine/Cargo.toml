[package]
name = "taverngym-wasm"
description = "WebAssembly bindings of TavernGym for the bg_advisor web app"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# TavernGym (Battlegrounds 37.0.2 with the 37.0.3 server hotfix): the bg-37.0.3 branch of
# WSED0412/AutoTavern, a fork of MCG-NJU/AutoTavern, until upstream has the hotfix.
taverngym = { git = "https://github.com/WSED0412/AutoTavern", rev = "caa6d46f2f13d40e6511be703e444a36a84960ab" }
serde_json = "1.0.151"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
